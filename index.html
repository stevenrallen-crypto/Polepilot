<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PolePilot v0.3.1</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
      color: #111827;
    }

    .wrap {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .barcode {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .pa {
      color: #6b7280;
      margin-bottom: 12px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 20px 0;
    }

    button {
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: white;
      font-size: 16px;
    }

    button.selected {
      background: #111827;
      color: white;
    }

    #saveNext {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      font-weight: 700;
    }

    .saved {
      color: green;
      font-weight: 700;
      margin-top: 12px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>PolePilot v0.3.1</h1>
    <p>Persistence torture test 🐹</p>

    <div class="card">
      <div id="progress"></div>
      <div id="barcode" class="barcode"></div>
      <div id="pa" class="pa"></div>
      <div id="scope"></div>

      <div id="statusButtons" class="status-grid"></div>

      <button id="saveNext">Save & Next →</button>

      <div id="feedback"></div>
    </div>

    <div class="card">
      <strong>Saved results</strong>
      <div id="summary"></div>
    </div>
  </div>

  <script>
    const poles = [
      { barcode: "TEST-001", pa: "TEST-PA-A", scope: "Fake test pole 1" },
      { barcode: "TEST-002", pa: "TEST-PA-A", scope: "Fake test pole 2" },
      { barcode: "TEST-003", pa: "TEST-PA-B", scope: "Fake test pole 3" },
      { barcode: "TEST-004", pa: "TEST-PA-B", scope: "Fake test pole 4" },
      { barcode: "TEST-005", pa: "TEST-PA-C", scope: "Fake test pole 5" }
    ];

    const statuses = [
      "Open",
      "Complete",
      "Hold-off Required",
      "Needs Review",
      "Not in Amidyne"
    ];

    const STORAGE_KEY = "polepilot-v031";

    let currentIndex = 0;
    let selectedStatus = "";
    let savedData = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    function saveStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData));
    }

    function render() {
      const pole = poles[currentIndex];

      document.getElementById("progress").textContent =
        (currentIndex + 1) + " / " + poles.length;

      document.getElementById("barcode").textContent = pole.barcode;
      document.getElementById("pa").textContent = pole.pa;
      document.getElementById("scope").textContent = pole.scope;

    

      const buttons = document.getElementById("statusButtons");
      buttons.innerHTML = "";

      statuses.forEach(status => {
        const button = document.createElement("button");
        button.textContent = status;

        if (status === selectedStatus) {
          button.classList.add("selected");
        }

        button.addEventListener("click", () => {
          selectedStatus = status;
          render();
        });

        buttons.appendChild(button);
      });

      renderSummary();
    }

    function renderSummary() {
      const summary = document.getElementById("summary");
      summary.innerHTML = "";

      poles.forEach(pole => {
        const row = document.createElement("div");
        row.className = "row";

        const left = document.createElement("span");
        left.textContent = pole.barcode;

        const right = document.createElement("span");
        right.textContent = savedData[pole.barcode] || "Unverified";

        row.appendChild(left);
        row.appendChild(right);
        summary.appendChild(row);
      });
    }

    document.getElementById("saveNext").addEventListener("click", () => {
      if (!selectedStatus) {
        document.getElementById("feedback").textContent =
          "Choose a status first.";
        return;
      }

      const pole = poles[currentIndex];

      savedData[pole.barcode] = selectedStatus;
      saveStorage();

      document.getElementById("feedback").textContent =
        "✓ SAVED: " + pole.barcode + " — " + selectedStatus;

      document.getElementById("feedback").className = "saved";

      if (currentIndex < poles.length - 1) {
        currentIndex++;
      }

      render();
    });

    render();
  </script>
</body>
</html>
