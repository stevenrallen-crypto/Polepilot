<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>PolePilot v0.3</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    main {
      max-width: 650px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 4px;
    }

    .subtitle {
      color: #6b7280;
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin: 16px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .barcode {
      font-size: 28px;
      font-weight: 700;
    }

    .pa {
      color: #6b7280;
      margin-top: 4px;
    }

    .scope {
      margin-top: 14px;
      font-size: 17px;
    }

    .progress {
      font-weight: 600;
      margin-bottom: 10px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      font-size: 16px;
      padding: 14px 10px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      background: white;
      color: #111827;
    }

    button.selected {
      background: #111827;
      color: white;
      border-color: #111827;
    }

    .save {
      width: 100%;
      margin-top: 16px;
      background: #2563eb;
      color: white;
      border: none;
      font-weight: 700;
    }

    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .feedback {
      margin-top: 14px;
      min-height: 24px;
      font-weight: 600;
    }

    .saved {
      color: #15803d;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .small {
      color: #6b7280;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      padding: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>
<main>
  <h1>PolePilot v0.3</h1>
  <p class="subtitle">Persistence torture test 🐹</p>

  <div class="card">
    <div class="progress" id="progress"></div>

    <div class="barcode" id="barcode"></div>
    <div class="pa" id="pa"></div>
    <div class="scope" id="scope"></div>

    <div class="status-grid" id="statusButtons"></div>

    <button class="save" id="saveNext">Save & Next →</button>

    <div class="nav-row">
      <button id="back">← Back</button>
      <button id="next">Next →</button>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="card">
    <strong>Saved test results</strong>
    <div id="summary"></div>
  </div>

  <div class="card">
    <strong>Emergency recovery copy</strong>
    <p class="small">
      This updates after every save. It is only a fallback while the page is open.
    </p>
    <textarea id="recovery" readonly></textarea>
  </div>
</main>

<script>
const poles = [
  {
    barcode: "TEST-001",
    pa: "TEST-PA-A",
    scope: "Fake test pole — choose any status"
  },
  {
    barcode: "TEST-002",
    pa: "TEST-PA-A",
    scope: "Fake test pole — choose any status"
  },
  {
    barcode: "TEST-003",
    pa: "TEST-PA-B",
    scope: "Fake test pole — choose any status"
  },
  {
    barcode: "TEST-004",
    pa: "TEST-PA-B",
    scope: "Fake test pole — choose any status"
  },
  {
    barcode: "TEST-005",
    pa: "TEST-PA-C",
    scope: "Fake test pole — choose any status"
  }
];

const statuses = [
  "Open",
  "Complete",
  "Hold-off Required",
  "Needs Review",
  "Not in Amidyne"
];

const STORAGE_KEY = "polepilot-v03-test-data";

let currentIndex = 0;
let selectedStatus = "";

function loadSavedData() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch {
    return {};
  }
}

let savedData = loadSavedData();

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData));
}

function renderStatusButtons() {
  const box = document.getElementById("statusButtons");
  box.innerHTML = "";

  statuses.forEach(status => {
    const button = document.createElement("button");
    button.textContent = status;

    if (selectedStatus === status) {
      button.classList.add("selected");
    }

    button.addEventListener("click", () => {
      selectedStatus = status;
      render();
    });

    box.appendChild(button);
  });
}

function renderSummary() {
  const summary = document.getElementById("summary");
  summary.innerHTML = "";

  poles.forEach(pole => {
    const row = document.createElement("div");
    row.className = "summary-row";

    const left = document.createElement("span");
    left.textContent = pole.barcode;

    const right = document.createElement("span");
    right.textContent = savedData[pole.barcode]?.status || "Unverified";

    row.append(left, right);
    summary.appendChild(row
